version: '3'

env:
  FFMPEG_DIR: '{{.ROOT_DIR}}/.runtime/ffmpeg'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  DEVELOPER_DIR: '{{.DEVELOPER_DIR | default "/Applications/Xcode.app/Contents/Developer"}}'

tasks:
  dev:
    desc: Watch sources, rebuild, and restart the GPUI app
    deps: [dev:tools]
    # Rust UI changes restart the process; in-memory UI state is reset.
    # The runner stops this watcher when the app exits successfully.
    cmd: >-
      sh -c 'MAZIT_DEV_WATCHER_PID=$$ exec watchexec
      --restart --debounce 300ms --stop-timeout 5s
      --watch src --watch migrations --watch js --watch scripts --watch assets
      --watch Cargo.toml --watch Cargo.lock --watch build.rs --watch Taskfile.yaml
      --watch package.json --watch bun.lock
      --shell none -- sh scripts/dev-run.sh'

  run:
    desc: Build and run the GPUI app once
    deps: [build:debug]
    cmd: ./target/debug/mazit

  build:debug:
    desc: Build the debug binary
    run: once
    deps: [prepare]
    cmd: cargo build --package mazit --bin mazit

  build:
    desc: Build the macOS Apple Silicon release binary
    run: once
    deps: [prepare]
    preconditions:
      - sh: test '{{OS}}/{{ARCH}}' = darwin/arm64
        msg: Build on an Apple Silicon Mac so bundled FFmpeg matches the release target.
    cmd: cargo build --release --target aarch64-apple-darwin --package mazit --bin mazit

  bundle:
    desc: Build dist/Mazit.app for macOS Apple Silicon
    deps: [build]
    cmds:
      - mkdir -p dist/Mazit.app/Contents/MacOS dist/Mazit.app/Contents/Resources
      - cp target/aarch64-apple-darwin/release/mazit dist/Mazit.app/Contents/MacOS/Mazit
      - cp assets/Info.plist dist/Mazit.app/Contents/Info.plist
      - cp "$FFMPEG_DIR/COPYING.LGPLv2.1" dist/Mazit.app/Contents/Resources/FFmpeg-LICENSE.txt

  lint:
    desc: Format and lint the TypeScript sources and Rust workspace
    run: once
    cmds:
      - task: js:lint
      - cargo fmt --all
      - cargo clippy --workspace --all-targets --features ui-tests -- -D warnings

  test:
    desc: Run JavaScript, Cargo workspace, and headless GPUI tests
    run: once
    deps: [test:js, test:unit, test:ui]

  test:js:
    desc: Test flat YouTube listing metadata extraction
    run: once
    cmd: bun run test

  test:unit:
    desc: Run Cargo workspace tests
    run: once
    cmd: cargo test --workspace

  test:ui:
    desc: Run headless GPUI layout and interaction tests
    run: once
    cmd: cargo test --lib --features ui-tests desktop::tests

  check:
    desc: Format, lint, and test the workspace
    deps: [lint, test]

  prepare:
    desc: Prepare the JavaScript bridge and native libraries
    run: once
    deps: [js:bundle, ffmpeg:build]

  js:bundle:
    internal: true
    run: once
    deps: [js:install]
    sources:
      - js/**/*.ts
      - tsconfig*.json
      - package.json
      - bun.lock*
      - bunfig.toml
      - Taskfile.yaml
    generates:
      - generated/youtube.js
    cmd: >-
      bun build js/youtube.ts --keep-names --target browser
      --format esm --outfile generated/youtube.js

  js:install:
    internal: true
    run: once
    sources:
      - package.json
      - bun.lock*
      - bunfig.toml
      - Taskfile.yaml
    generates:
      - node_modules/{youtubei.js,oxfmt,oxlint,typescript,@types/bun}/package.json
    cmd: bun install --frozen-lockfile

  js:lint:
    desc: Format TypeScript sources and configuration, then lint with Oxlint
    run: once
    cmds:
      - bun run oxfmt --write js scripts package.json tsconfig.json .oxfmtrc.json
      - bun run oxlint --deny-warnings js scripts

  ffmpeg:build:
    internal: true
    run: once
    sources:
      - scripts/prepare-ffmpeg.ts
      - scripts/tsconfig*.json
      - tsconfig*.json
      - Taskfile.yaml
    generates:
      - .runtime/ffmpeg/lib/lib{avcodec,avformat,avutil,swresample}.a
      - .runtime/ffmpeg/lib/pkgconfig/lib{avcodec,avformat,avutil,swresample}.pc
      - .runtime/ffmpeg/include/libavcodec/avcodec.h
      - .runtime/ffmpeg/include/libavformat/avformat.h
      - .runtime/ffmpeg/include/libavutil/avutil.h
      - .runtime/ffmpeg/include/libswresample/swresample.h
      - .runtime/ffmpeg/COPYING.LGPLv2.1
    cmd: bun run scripts/prepare-ffmpeg.ts

  dev:tools:
    internal: true
    run: once
    status:
      - command -v watchexec
    cmd: cargo install --locked watchexec-cli --version 2.7.3
