version: '3'

env:
  FFMPEG_DIR: '{{.ROOT_DIR}}/.runtime/ffmpeg'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  DEVELOPER_DIR: '{{.DEVELOPER_DIR | default "/Applications/Xcode.app/Contents/Developer"}}'

tasks:
  dev:
    desc: Watch sources, rebuild, and restart the GPUI app
    deps: [dev:tools]
    # Rust UI changes restart the process; in-memory UI state is reset.
    cmd: >-
      watchexec --restart --debounce 300ms --stop-timeout 5s
      --watch src --watch js --watch scripts --watch assets
      --watch Cargo.toml --watch Cargo.lock --watch Taskfile.yaml
      --watch package.json --watch bun.lock
      --shell none -- task run -- {{.CLI_ARGS}}

  run:
    desc: Build and run the GPUI app once
    deps: [build:debug]
    cmd: ./target/debug/mazit {{.CLI_ARGS}}

  build:debug:
    desc: Build the debug binary
    run: once
    deps: [prepare]
    cmd: cargo build --package mazit --bin mazit

  build:
    desc: Build the macOS Apple Silicon release binary
    run: once
    deps: [prepare]
    preconditions:
      - sh: test '{{OS}}/{{ARCH}}' = darwin/arm64
        msg: Build on an Apple Silicon Mac so bundled FFmpeg matches the release target.
    cmd: cargo build --release --target aarch64-apple-darwin --package mazit --bin mazit

  bundle:
    desc: Build dist/Mazit.app for macOS Apple Silicon
    deps: [build]
    cmds:
      - mkdir -p dist/Mazit.app/Contents/MacOS dist/Mazit.app/Contents/Resources
      - cp target/aarch64-apple-darwin/release/mazit dist/Mazit.app/Contents/MacOS/Mazit
      - cp assets/Info.plist dist/Mazit.app/Contents/Info.plist
      - cp "$FFMPEG_DIR/COPYING.LGPLv2.1" dist/Mazit.app/Contents/Resources/FFmpeg-LICENSE.txt

  lint:
    desc: Format and lint the TypeScript sources and Rust workspace
    deps: [prepare]
    cmds:
      - task: js:lint
      - cargo fmt --all
      - cargo clippy --workspace -- -D warnings

  prepare:
    desc: Prepare the JavaScript bridge and native libraries
    run: once
    deps: [js:bundle, ffmpeg:build]

  js:bundle:
    internal: true
    run: once
    deps: [js:install]
    cmd: >-
      bun build js/youtube.ts --keep-names --target browser
      --format esm --outfile generated/youtube.js

  js:install:
    internal: true
    run: once
    cmd: bun install --frozen-lockfile

  js:lint:
    desc: Format TypeScript sources and configuration, then lint with Oxlint
    deps: [js:install]
    cmds:
      - bunx --no-install oxfmt --write js scripts package.json tsconfig.json .oxfmtrc.json
      - bunx --no-install oxlint --deny-warnings js scripts

  ffmpeg:build:
    internal: true
    run: once
    cmd: bun scripts/prepare-ffmpeg.ts

  dev:tools:
    internal: true
    run: once
    status:
      - command -v watchexec
    cmd: cargo install --locked watchexec-cli --version 2.7.3
